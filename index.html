<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#eeede9" />
    <meta name="description" content="Old_glasses 的个人作品集。独立设计师，聚焦体验设计、创意设计与动态影像。With Creative From Heart." />
    <title>Old_glasses® — With Creative From Heart</title>
    <link rel="preload" href="/fonts/dm-sans-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/bodoni-moda-latin.woff2" as="font" type="font/woff2" crossorigin />
    <!-- 首屏必要样式内联：JavaScript 和三维模块下载期间，Loading 已经可见。 -->
    <style>
      body { margin: 0; background: #f0f0ee; }
      body[data-boot="loading"] #app { visibility: hidden; }
      .site-loader { --loader-unit: clamp(8.267px, .83333vw, 32px); --side-shift: 110%; --side-opacity: 0; position: fixed; inset: 0; z-index: 70; overflow: hidden; color: #161715; pointer-events: all; font: 500 calc(var(--loader-unit) * 1.125)/1.4 'DM Sans', 'PingFang SC', sans-serif; }
      .loader-count { position: absolute; left: 50%; top: 60%; transform: translate(-50%, -50%); display: flex; height: 1em; font: 400 calc(var(--loader-unit) * 6)/1 'Bodoni Moda', 'Times New Roman', serif; letter-spacing: -.04em; font-variant-numeric: lining-nums tabular-nums; }
      .loader-cell, .loader-cell-shell { display: block; flex: none; height: 1em; overflow: hidden; }
      .loader-drum { display: block; text-align: center; }
      .loader-drum > span { display: block; height: 1em; line-height: 1; }
      .loader-side { position: absolute; top: 50%; transform: translateY(-50%); overflow: hidden; }
      .loader-side > span { display: flex; transform: translateY(var(--side-shift)); opacity: var(--side-opacity); }
      .loader-side-left { left: .5em; }
      .loader-side-right { right: .5em; font-variant-numeric: tabular-nums; }
      .loader-status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); }
      @media (max-width: 991px) { .site-loader { --loader-unit: clamp(12.4px, 1.61453vw, 16px); } .loader-count { font-size: calc(var(--loader-unit) * 4.5); } }
      @media (max-width: 767px) { .site-loader { --loader-unit: clamp(10.01px, 2.08605vw, 16px); } .loader-count { font-size: calc(var(--loader-unit) * 3.5); } .loader-side { display: none; } }
      @media (max-width: 479px) { .site-loader { --loader-unit: clamp(10.69px, 3.34029vw, 16px); } .loader-count { font-size: calc(var(--loader-unit) * 2.75); } }
    </style>
  </head>
  <body data-boot="loading">
    <div class="site-loader" id="site-loader" role="progressbar" aria-label="作品集准备进度" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
      <div class="loader-count" data-loading-count aria-hidden="true">0</div>
      <div class="loader-side loader-side-left" aria-hidden="true"><span>Old_glasses®</span></div>
      <div class="loader-side loader-side-right" aria-hidden="true"><span data-loading-year>2016</span></div>
      <p class="loader-status" data-loading-label role="status" aria-live="polite">准备作品集</p>
    </div>
    <div id="app" inert aria-busy="true"></div>
    <noscript>
      <style>#site-loader { display: none; }</style>
      <p style="padding:24px">请启用 JavaScript 后刷新，查看 Old_glasses 的互动作品集。</p>
    </noscript>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
