<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#eeede9" />
    <meta name="description" content="Old_glasses 的个人作品集。独立设计师，聚焦体验设计、创意设计与动态影像。With Creative From Heart." />
    <title>Old_glasses® — With Creative From Heart</title>
    <link rel="preload" href="/fonts/dm-sans-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/bodoni-moda-latin.woff2" as="font" type="font/woff2" crossorigin />
    <!-- 首屏必要样式内联：JavaScript 和三维模块下载期间，Loading 已经可见。 -->
    <style>
      body { margin: 0; background: #f0f0ee; }
      body[data-boot="loading"] #app { visibility: hidden; }
      .site-loader { --loading-progress: 0; position: fixed; inset: 0; z-index: 1000; display: grid; place-items: center; background: #f0f0ee; color: #161715; font: 11px/1.5 'DM Sans', 'PingFang SC', sans-serif; }
      .loader-center { display: grid; justify-items: center; width: min(260px, 70vw); }
      .loader-disc { width: 108px; height: 108px; border-radius: 50%; margin-bottom: 28px; background: conic-gradient(from 20deg,#777e85,#fafbf9 12%,#acb9c1 23%,#e2e5e1 35%,#767c83 49%,#eef0ee 63%,#a3adb3 78%,#f9faf7 89%,#777e85); mask: radial-gradient(circle,transparent 0 10px,#000 11px); box-shadow: inset 0 0 0 1px #8c949a; animation: loader-turn 2.8s linear infinite; }
      .loader-brand { margin: 0; font: 400 27px/1.2 'Bodoni Moda', 'Times New Roman', serif; letter-spacing: -1px; }
      .loader-brand sup { font: 10px sans-serif; vertical-align: top; margin-left: 2px; }
      .loader-meter { display: flex; justify-content: space-between; align-items: baseline; width: 100%; margin-top: 38px; letter-spacing: 1.3px; font-size: 8px; }
      .loader-count { font-size: 12px; letter-spacing: 0; font-variant-numeric: tabular-nums; }
      .loader-count small { font-size: 8px; padding-left: 2px; }
      .loader-track { height: 1px; width: 100%; background: #ced0cb; margin-top: 10px; }
      .loader-track::after { content: ''; display: block; height: 100%; background: #161715; transform: scaleX(var(--loading-progress)); transform-origin: left; transition: transform .25s ease; }
      .loader-label { margin: 12px 0 0; min-height: 18px; font-size: 10px; color: #777973; }
      .loader-footer { position: absolute; left: 0; right: 0; bottom: max(28px, env(safe-area-inset-bottom)); text-align: center; font-size: 8px; letter-spacing: 1.2px; }
      @keyframes loader-turn { to { transform: rotate(360deg); } }
      @media (prefers-reduced-motion: reduce) { .loader-disc { animation: none; } .loader-track::after { transition: none; } }
    </style>
  </head>
  <body data-boot="loading">
    <div class="site-loader" id="site-loader">
      <div class="loader-center">
        <div class="loader-disc" aria-hidden="true"></div>
        <p class="loader-brand">Old_glasses<sup>®</sup></p>
        <div class="loader-meter" data-loading-progress role="progressbar" aria-label="作品集准备进度" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
          <span>LOADING THE ARCHIVE</span><span class="loader-count"><span data-loading-count>000</span><small>%</small></span>
        </div>
        <div class="loader-track" aria-hidden="true"></div>
        <p class="loader-label" data-loading-label role="status" aria-live="polite">准备作品集</p>
      </div>
      <span class="loader-footer">WITH CREATIVE FROM HEART.</span>
    </div>
    <div id="app" inert aria-busy="true"></div>
    <noscript>
      <style>#site-loader { display: none; }</style>
      <p style="padding:24px">请启用 JavaScript 后刷新，查看 Old_glasses 的互动作品集。</p>
    </noscript>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
